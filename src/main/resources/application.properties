spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bus_transport}
spring.datasource.username=${DB_USERNAME:bus_user}
spring.datasource.password=${DB_PASSWORD:bus_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8082}
jwt.secret=${JWT_SECRET:dev-secret-change-me-in-production-please-32chars-min}

# Recommendation score weights. Values are normalized automatically and may be
# overridden with environment variables for different deployment priorities.
recommendations.weights.arrival-time=${RECOMMENDATION_WEIGHT_ARRIVAL_TIME:0.35}
recommendations.weights.capacity=${RECOMMENDATION_WEIGHT_CAPACITY:0.25}
recommendations.weights.student-distance=${RECOMMENDATION_WEIGHT_STUDENT_DISTANCE:0.15}
recommendations.weights.total-travel-time=${RECOMMENDATION_WEIGHT_TOTAL_TRAVEL_TIME:0.25}